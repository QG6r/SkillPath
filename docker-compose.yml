services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_NAME: SkillPath
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      DB_CONNECTION: sqlite
      DB_DATABASE: /data/database.sqlite
      SESSION_DRIVER: database
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
      LOG_CHANNEL: stderr
    volumes:
      - skillpath-data:/data

volumes:
  skillpath-data:
